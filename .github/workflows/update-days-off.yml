name: Update Days Off Counter

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:       # Manual trigger bhi ho sake

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Calculate Days Off
        id: days
        run: |
          START="2026-05-27"
          TODAY=$(date +%Y-%m-%d)
          DAYS=$(( ( $(date -d "$TODAY" +%s) - $(date -d "$START" +%s) ) / 86400 ))
          echo "days=$DAYS" >> $GITHUB_OUTPUT
          echo "Today: $TODAY, Days off: $DAYS"

      - name: Update README
        run: |
          DAYS=${{ steps.days.outputs.days }}
          # Replace the days off line in README
          sed -i "s/![Days Off].*$/![Days Off](https:\/\/img.shields.io\/badge\/🔴_OFF-Day_${DAYS}_Since_27_May_2026-dc2626?style=for-the-badge\&labelColor=1a0000)/" README.md

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "🔴 Day ${{ steps.days.outputs.days }} off — auto update"
          git push
